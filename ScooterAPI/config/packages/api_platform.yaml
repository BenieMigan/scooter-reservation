api_platform:
    mapping:
        paths:
            - '%kernel.project_dir%/Src/Infrastructure/ApiPlatform/Resource'
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
    exception_to_status:
        Src\Domain\User\Exception\EmailAlreadyUsedException: 409
        Src\Domain\Scooter\Exception\ScooterAlreadyExistsException: 409
        Src\Domain\Scooter\Exception\ScooterNotFoundException: 404
        Src\Domain\User\Exception\UnknownUserException: 404
        Src\Domain\Scooter\Exception\NotScooterOwnerException: 403
        Src\Domain\Scooter\Exception\AccessAlreadyGrantedException: 409
        Src\Domain\Reservation\Exception\InvalidReservationPeriodException: 422
        Src\Domain\Reservation\Exception\ReservationInThePastException: 422
        Src\Domain\Reservation\Exception\ScooterNotAvailableException: 409
        Src\Domain\Scooter\Exception\PersonNotAuthorizedException: 422
        Src\Domain\Reservation\Exception\ReservationNotFoundException: 404
        Src\Domain\Reservation\Exception\ReservationAlreadyProcessedException: 409
        Src\Domain\Reservation\Exception\OwnerCannotRequestOwnScooterException: 422